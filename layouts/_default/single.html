<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }}</title>
  <style>
    * { box-sizing: border-box; }
    body { font-size: 15px; line-height: 1.7; background: #1a1a1a; color: #d0d0d0; margin: 0; padding: 1rem; }
    .page-header { background: #2a2a2a; padding: 0.8rem 1rem; border-radius: 8px 8px 0 0; }
    .site-title { color: #888; font-size: 0.8rem; margin: 0 0 0.2rem 0; }
    .site-title a { color: #60a5fa; text-decoration: none; }
    .site-title a:hover { color: #93c5fd; }
    .chapter-title { color: #ffffff; font-size: 1rem; font-weight: 600; margin: 0 0 0.5rem 0; }
    .back-link { display: inline-block; color: #60a5fa; text-decoration: none; font-size: 13px; margin-bottom: 0.5rem; }
    .back-link:hover { color: #93c5fd; }
    .main-content { background: #2a2a2a; padding: 1.2rem; border-radius: 0 0 8px 8px; max-width: 800px; }
    h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 1rem; color: #ffffff; }
    h2 { font-size: 1.1rem; font-weight: 600; margin: 1.2rem 0 0.4rem 0; color: #60a5fa; border-bottom: 1px solid #333; padding-bottom: 0.2rem; }
    h3 { font-size: 1rem; font-weight: 600; margin: 0.8rem 0 0.3rem 0; color: #93c5fd; }
    h4 { font-size: 0.95rem; font-weight: 600; margin: 0.6rem 0 0.2rem 0; color: #c0c0c0; }
    p { font-size: 15px; margin: 0.5rem 0; color: #d0d0d0; }
    li { font-size: 15px; margin: 0.25rem 0; color: #d0d0d0; }
    strong { color: #ffffff; font-weight: 600; }
    hr { border: none; border-top: 1px solid #333; margin: 1rem 0; }
    blockquote { background: #333; padding: 0.8rem; border-radius: 4px; margin: 1rem 0; border-left: 3px solid #f87171; }
    table { width: 100%; border-collapse: collapse; margin: 1rem 0; overflow-x: auto; display: block; }
    th, td { padding: 0.5rem; text-align: left; border: 1px solid #333; }
    th { background: #333; color: #ffffff; }
    tr:nth-child(even) { background: #252525; }
  </style>
</head>
<body>
  <div class="page-header">
    <p class="site-title"><a href="/marino_icu/">Marino's ICU Book</a></p>
    <h1 class="chapter-title">{{ .Title }}</h1>
    <a class="back-link" href="/marino_icu/">← Back to List</a>
  </div>
  <div class="main-content">
    {{ .Content }}
  </div>
</body>
</html>
