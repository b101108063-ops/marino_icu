{{ define "main" }}
<header class="page-header" style="text-align:center;margin-bottom:2rem;">
    <h1>Marino ICU Book</h1>
    <p style="color:#9ca3af;font-size:1.1rem;margin-top:0.5rem;">The Little ICU Book, 4th Edition</p>
</header>

<div class="bookshelf-container">
    <div class="book-card">
        <h2 class="book-card-title">Marino's ICU Book (4th Edition)</h2>
        <div class="book-card-actions">
            <a href="{{ "marino_icu/" | absURL }}" class="book-action-btn primary">📖 章節清單</a>
            <a href="{{ "search/" | absURL }}" class="book-action-btn secondary">🔍 搜尋</a>
        </div>
    </div>
</div>

<style>
.bookshelf-container{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:1.5rem}
.book-card{background:#1e1f20;border:1px solid #38393a;border-radius:10px;padding:1.8rem}
.book-card-title{font-size:1.25rem;font-weight:bold;color:#3a86ff;margin:0}
.book-card-actions{display:flex;gap:12px;margin-top:1rem}
.book-action-btn{flex:1;display:flex;align-items:center;justify-content:center;padding:0.9rem 1.2rem;border-radius:8px;text-decoration:none;font-weight:bold;font-size:1rem;transition:all 0.2s;box-sizing:border-box}
.book-action-btn.primary{background:#3a86ff;color:#fff}
.book-action-btn.primary:hover{background:#2563eb;transform:translateY(-2px)}
.book-action-btn.secondary{background:#242526;color:#3a86ff;border:1px solid #38393a}
.book-action-btn.secondary:hover{background:#3a86ff;color:#fff;border-color:#3a86ff;transform:translateY(-2px)}
</style>
{{ end }}
