<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marino ICU Book - 章節清單</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-size: 15px;
      line-height: 1.7;
      background: #1a1a1a;
      color: #d0d0d0;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .layout {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: #161616;
      border-right: 1px solid #2a2a2a;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      padding: 1rem 0;
    }
    .sidebar-header {
      padding: 0.6rem 1rem 0.4rem;
      border-bottom: 1px solid #2a2a2a;
    }
    .sidebar-site-title {
      font-size: 0.75rem;
      color: #888;
      margin: 0;
    }
    .sidebar-site-title a {
      color: #60a5fa;
      text-decoration: none;
    }
    .sidebar-site-title a:hover {
      color: #93c5fd;
    }
    .sidebar-title {
      font-size: 0.9rem;
      color: #ccc;
      margin: 0.3rem 0 0 0;
      font-weight: 500;
    }
    .sidebar-nav {
      padding: 0.5rem;
    }
    .sidebar-section-label {
      font-size: 0.65rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.6rem 0.5rem 0.2rem;
      margin: 0;
    }
    .sidebar-link {
      display: block;
      padding: 0.35rem 0.6rem;
      font-size: 0.8rem;
      color: #888;
      text-decoration: none;
      border-radius: 4px;
      border-left: 2px solid transparent;
      transition: all 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sidebar-link:hover {
      color: #d0d0d0;
      background: #1e1e1e;
      border-left-color: #3a86ff;
    }
    .sidebar-link.active {
      color: #60a5fa;
      background: #1e1e1e;
      border-left-color: #3a86ff;
    }
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .page-header {
      background: #2a2a2a;
      padding: 0.7rem 1.5rem;
      border-bottom: 1px solid #333;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 0.2rem;
    }
    .breadcrumb a {
      color: #60a5fa;
      text-decoration: none;
    }
    .breadcrumb a:hover {
      color: #93c5fd;
    }
    .breadcrumb-sep {
      color: #444;
    }
    .page-title {
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      margin: 0;
    }
    .content-area {
      flex: 1;
      padding: 1.5rem 2rem 3rem;
      max-width: 860px;
    }
    .search-btn {
      display: inline-block;
      background: #3a86ff;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .search-btn:hover {
      background: #2563eb;
    }
    .list-item {
      display: grid;
      grid-template-columns: 50px 1fr 30px;
      align-items: center;
      padding: 0.7rem 1rem;
      background: #242526;
      border-radius: 6px;
      border: 1px solid #38393a;
      margin-bottom: 0.5rem;
      text-decoration: none;
      color: #d0d0d0;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .list-item:hover {
      background: #2a2b2c;
      border-color: #3a86ff;
      transform: translateX(4px);
    }
    .ch-num {
      color: #3a86ff;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .section-title {
      color: #e5e5e5;
    }
    .arrow {
      color: #3a86ff;
      text-align: right;
    }
    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }
      .content-area {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <div class="sidebar-header">
      <p class="sidebar-site-title"><a href="/marino_icu/">Marino ICU</a></p>
      <p class="sidebar-title">Marino ICU Book</p>
    </div>
    <div class="sidebar-nav">
      <p class="sidebar-section-label">章節</p>
      {{ range .Site.RegularPages.ByWeight }}
      <a href="{{ .Permalink }}" class="sidebar-link">{{ .Params.chapter }} {{ .Title }}</a>
      {{ end }}
    </div>
  </nav>

  <div class="main-wrapper">
    <header class="page-header">
      <div class="breadcrumb">
        <span>Marino ICU</span>
        <span class="breadcrumb-sep">›</span>
        <span>章節清單</span>
      </div>
      <h1 class="page-title">章節清單</h1>
    </header>

    <div class="content-area">
      <a href="/marino_icu/search/" class="search-btn">🔍 搜尋</a>
      {{ range .Site.RegularPages.ByWeight }}
      <a href="{{ .Permalink }}" class="list-item">
        <span class="ch-num">{{ .Params.chapter }}</span>
        <span class="section-title">{{ .Title }}</span>
        <span class="arrow">➔</span>
      </a>
      {{ end }}
    </div>
  </div>
</div>
</body>
</html>
