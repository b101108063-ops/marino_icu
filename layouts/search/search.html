{{ define "main" }}
<header class="page-header"><h1>🔍 Marino ICU 章節搜尋</h1></header>
<div class="search-container">
    <input type="text" id="search-input" placeholder="輸入關鍵字..." autocomplete="off">
    <div id="search-database" style="display:none;">
        {{- range site.RegularPages -}}
        <div data-title="{{ .Title }}" data-specialty="{{ .Params.specialty }}" data-content="{{ .Plain | htmlUnescape }}" data-permalink="{{ .Permalink }}"></div>
        {{- end -}}
    </div>
    <div id="search-results" class="search-results-grid"></div>
</div>
<script>
document.addEventListener("DOMContentLoaded",function(){
var input=document.getElementById("search-input");
var results=document.getElementById("search-results");
var data=Array.from(document.querySelectorAll("#search-database div")).map(function(el){return{title:el.getAttribute("data-title"),specialty:el.getAttribute("data-specialty"),content:el.getAttribute("data-content").toLowerCase(),permalink:el.getAttribute("data-permalink")};});
input.addEventListener("input",function(e){
var q=e.target.value.toLowerCase().trim();
results.innerHTML="";
if(q==="")return;
var matches=data.filter(function(d){return d.title.toLowerCase().includes(q)||d.content.includes(q);});
if(matches.length===0){results.innerHTML='<p style="color:#999;text-align:center;margin-top:2rem;">找不到相關章節</p>';return;}
matches.slice(0,20).forEach(function(d){
var a=document.createElement("a");
a.href=d.permalink;
a.className="search-result-item";
a.innerHTML='<div style="font-size:0.85rem;color:#3a86ff;margin-bottom:4px;">'+d.specialty+'</div><div style="font-size:1.05rem;font-weight:bold;color:#e5e7eb;">📖 '+d.title+'</div>';
results.appendChild(a);});});});
</script>
<style>
.search-container{max-width:800px;margin:2rem auto;padding:0 1rem}
#search-input{width:100%;padding:1rem 1.2rem;font-size:1.1rem;border:2px solid #38393a;border-radius:8px;box-sizing:border-box;background:#242526;color:#e5e7eb}
#search-input:focus{border-color:#3a86ff}
.search-results-grid{display:flex;flex-direction:column;gap:12px;margin-top:1.5rem}
.search-result-item{display:block;padding:1rem 1.2rem;background:#242526;text-decoration:none;border-radius:8px;border:1px solid #38393a;transition:all 0.2s;box-sizing:border-box}
.search-result-item:hover{background:#2a2b2c;border-color:#3a86ff;transform:translateX(4px)}
</style>
{{ end }}
